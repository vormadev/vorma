[package]
name = "vorma-framework-tests"
default-run = "framework-bombadil"
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
version.workspace = true

[dependencies]
axum.workspace = true
bytes.workspace = true
http-body-util.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tower.workspace = true
ureq.workspace = true
url.workspace = true
vorma.workspace = true
vorma-build.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "framework-build"
path = "src/bin/build.rs"

[[bin]]
name = "framework-serve"
path = "src/bin/serve.rs"

[[bin]]
name = "framework-bombadil"
path = "src/bin/bombadil.rs"
